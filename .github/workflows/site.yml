name: Mettre le site en ligne

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tester la logique du site
        run: (node --no-warnings test/test.mjs && node --no-warnings test/tirage.mjs) 2>&1 | tee ../test-site.log; test ${PIPESTATUS[0]} -eq 0

      - name: Tester avec l'outil officiel de Cloudflare (en local)
        run: |
          npx --yes wrangler@3 d1 execute terminagotchi --local --file=schema.sql
          (npx wrangler@3 dev --local --port 8787 > dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8787/api/classement > /dev/null && break; sleep 2; done
          curl -sf -X POST localhost:8787/api/inscription -H 'content-type: application/json' -d '{"pseudo":"TestCI"}' | grep -q '"cle"'
          curl -sf localhost:8787/ | grep -q Terminagotchi
          curl -sfI localhost:8787/ctf/TestCI/1 | grep -qi x-drapeau
          echo "✔ le site fonctionne avec wrangler"

      - name: Vérifier les secrets Cloudflare
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets Cloudflare absents : le site est testé mais pas mis en ligne."
          fi

      - name: Diagnostic de la clé Cloudflare
        if: steps.secrets.outputs.ok == '1'
        run: |
          A="https://api.cloudflare.com/client/v4"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          resume() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.success?"OK":"REFUSÉ "+JSON.stringify(j.errors))}catch(e){console.log("réponse illisible")}})'; }
          {
            echo "jeton valide ?          $(curl -s -H "$H" $A/user/tokens/verify | resume)"
            echo "comptes visibles :"
            curl -s -H "$H" "$A/accounts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);for(const a of j.result||[])console.log("   - "+a.name+(a.id===process.env.CLOUDFLARE_ACCOUNT_ID?"   ← correspond à CLOUDFLARE_ACCOUNT_ID":""));if(!(j.result||[]).length)console.log("   (aucun)")}catch(e){console.log("   illisible")}})'
            echo "ID de compte (longueur) : ${#CLOUDFLARE_ACCOUNT_ID} caractères"
            echo "accès Workers ?         $(curl -s -H "$H" $A/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts | resume)"
            echo "accès D1 ?              $(curl -s -H "$H" $A/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database | resume)"
          } 2>&1 | tee diag.log

      - name: Préparer la base de données
        if: steps.secrets.outputs.ok == '1'
        run: |
          set -o pipefail
          {
            echo "== wrangler whoami"; npx wrangler@3 whoami || true
            echo "== d1 list"; npx wrangler@3 d1 list --json > d1.json; cat d1.json
          } 2>&1 | tee db.log
          ID=$(node -e 'try{const l=JSON.parse(require("fs").readFileSync("d1.json","utf8"));const d=l.find(x=>x.name==="terminagotchi");console.log(d?(d.uuid||d.id||""):"")}catch(e){console.log("")}')
          if [ -z "$ID" ]; then
            npx wrangler@3 d1 create terminagotchi 2>&1 | tee -a db.log
            ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' db.log | tail -1)
          fi
          echo "Base : $ID" | tee -a db.log
          test -n "$ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          npx wrangler@3 d1 execute terminagotchi --remote --file=schema.sql 2>&1 | tee -a db.log

      - name: Mettre en ligne
        if: steps.secrets.outputs.ok == '1'
        run: |
          npx wrangler@3 deploy 2>&1 | tee deploy.log
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 > url.txt
          # Nom de domaine perso : utilisé dès qu'il répond (sinon on garde l'adresse workers.dev)
          # (n'importe quelle réponse HTTP suffit : le pare-feu Cloudflare peut répondre 403 aux robots de GitHub)
          CODE=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' https://terminagotchi.com/ || true)
          echo "terminagotchi.com répond : $CODE" | tee -a deploy.log
          case "$CODE" in [1-5]??) echo "https://terminagotchi.com" > url.txt ;; esac
          echo "Adresse du site : $(cat url.txt)"
          test -s url.txt

      - name: Publier l'adresse du site (branche site-info)
        if: always()
        run: |
          mkdir -p /tmp/info && cd /tmp/info
          cp "$GITHUB_WORKSPACE/site/url.txt" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/test-site.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/site/deploy.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/site/dev.log" . 2>/dev/null || true
          sed -E 's/[A-Za-z0-9_-]{40}/[masqué]/g' "$GITHUB_WORKSPACE/site/db.log" > db.log 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/site/diag.log" . 2>/dev/null || true
          git init -q && git checkout -q -b site-info
          git add -A
          git -c user.name="deploiement" -c user.email="deploiement@terminagotchi" commit -q -m "Site : run ${{ github.run_number }}" --allow-empty
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" site-info
