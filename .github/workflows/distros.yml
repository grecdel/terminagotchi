name: Les leçons sur chaque distribution Linux

# Les fiches et toute l'histoire du PC, rejouées dans un vrai bash (pc/outils/rejeu_bash.py) sur les
# distributions les plus courantes : la dernière Ubuntu, Ubuntu LTS, Debian, Fedora, Arch Linux, openSUSE.
# Chaque distribution a ses propres outils (coreutils GNU ou en Rust, curl, bash, gestionnaire de paquets) :
# une sortie que le jeu montre ou attend et qui change sur l'une d'elles fait échouer sa colonne.
on:
  push:
    branches: [main]
    paths: ["pc/**", "donnees/programme.json", ".github/workflows/distros.yml"]
  pull_request:
    paths: ["pc/**", "donnees/programme.json", ".github/workflows/distros.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"          # chaque lundi : une nouvelle version d'un outil se voit tout de suite

permissions:
  contents: read

jobs:
  rejeu:
    name: ${{ matrix.nom }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Ubuntu (dernière version)
            image: ubuntu:latest
            famille: apt
          - nom: Ubuntu 24.04 LTS
            image: ubuntu:24.04
            famille: apt
          - nom: Debian (stable)
            image: debian:stable
            famille: apt
          - nom: Fedora
            image: fedora:latest
            famille: dnf
          - nom: Arch Linux
            image: archlinux:latest
            famille: pacman
          - nom: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            famille: zypper
    steps:
      - name: Les outils des fiches (avec le gestionnaire de paquets de la distribution)
        run: |
          case "${{ matrix.famille }}" in
            apt)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq python3 git curl ca-certificates locales sudo tree iproute2 iputils-ping \
                iputils-tracepath openssh-client dnsutils bsdextrautils openssl xxd gnupg qemu-utils pciutils usbutils \
                bc iw rfkill zsh gcc make file sqlite3 gawk busybox imagemagick ffmpeg sox libimage-exiftool-perl \
                mksh cron procps hostname less >/dev/null || true ;;
            dnf)
              dnf install -y -q python3 git curl sudo tree iproute iputils openssh-clients bind-utils util-linux \
                openssl vim-common gnupg2 qemu-img pciutils usbutils bc iw zsh gcc make file sqlite gawk busybox \
                ImageMagick ffmpeg-free sox perl-Image-ExifTool mksh cronie procps-ng hostname diffutils findutils \
                which less glibc-langpack-en || true ;;
            pacman)
              pacman -Syu --noconfirm --needed python git curl sudo tree iproute2 iputils openssh bind util-linux \
                openssl vim gnupg qemu-img pciutils usbutils bc iw zsh gcc make file sqlite gawk busybox imagemagick \
                ffmpeg sox perl-image-exiftool mksh cronie procps-ng inetutils diffutils findutils which less || true ;;
            zypper)
              zypper -n -q install python3 git curl sudo tree iproute2 iputils openssh-clients bind-utils util-linux \
                openssl vim gpg2 qemu-tools pciutils usbutils bc iw zsh gcc make file sqlite3 gawk busybox ImageMagick \
                ffmpeg sox exiftool mksh cronie procps hostname diffutils findutils which less tar gzip || true ;;
          esac
          . /etc/os-release && echo "$PRETTY_NAME"
          bash --version | head -n 1
          ls --version 2>&1 | head -n 1
          curl --version | head -n 1
          python3 --version

      - uses: actions/checkout@v4

      - name: "Un élève, pas root (les leçons sur les droits doivent pouvoir dire « Permission denied »)"
        run: |
          useradd -m eleve 2>/dev/null || adduser -D eleve
          chown -R eleve "$GITHUB_WORKSPACE"

      - name: Les fiches et l'histoire du PC, dans un vrai bash
        run: |
          su eleve -c "cd '$GITHUB_WORKSPACE' && git config --global user.name eleve && git config --global user.email eleve@example.invalid \
            && LC_ALL=C.UTF-8 python3 pc/outils/rejeu_bash.py" 2>&1 | tee /tmp/rejeu.out
          grep -q " 0 écarts" /tmp/rejeu.out || { grep -E "ÉCART|✖" /tmp/rejeu.out | head -40 | sed 's/^/::error::/'; exit 1; }
