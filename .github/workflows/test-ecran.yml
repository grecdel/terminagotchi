name: Tester sur un téléphone virtuel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Activer l'accélération KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Jouer une partie et prendre des captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tests/scenario.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/

      - name: Ranger les captures dans la branche « captures »
        if: always()
        run: |
          mkdir -p captures
          grep -E "^e: |error:|What went wrong|AAPT|\.xml:" build.log > captures/erreurs_compilation.txt 2>/dev/null || true
          cd captures
          git init -q
          git checkout -q -b captures
          git add -A
          git -c user.name="test-auto" -c user.email="test@terminagotchi" commit -q -m "Captures du test ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" captures
