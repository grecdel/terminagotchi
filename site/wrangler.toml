name = "terminagotchi"
main = "src/worker.js"
compatibility_date = "2024-09-23"
# Ancienne adresse *.workers.dev désactivée : le site vit sur terminagotchi.com (domaine branché dans Cloudflare)
workers_dev = false

# images des animations (public/anim/…)
[assets]
directory = "./public"

# Anti-triche : secret qui signe les graines des apparitions (voir src/tirage.js).
# À régler UNE fois, il n'est jamais écrit dans le dépôt :   npx wrangler secret put SECRET_GRAINES
# (taper une longue valeur au hasard, par exemple la sortie de  openssl rand -hex 32).
# Sans lui, le site marche mais ne distribue aucune graine : toutes les captures restent « non vérifiées ».

[[d1_databases]]
binding = "DB"
database_name = "terminagotchi"
# Rempli automatiquement par le déploiement GitHub (ne pas modifier à la main)
database_id = "00000000-0000-0000-0000-000000000000"

# Chaque jour à 3 h 17 (UTC) : efface ce qui a dépassé sa durée de conservation
# (comptes inactifs, adresses IP des compteurs anti-abus, jetons et sessions expirés) — voir CONSERVATION dans src/worker.js.
[triggers]
crons = ["17 3 * * *"]
